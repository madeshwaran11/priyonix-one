
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:priyonix}

# ---------------------------------------------------------------------------
# Authentication, password reset and mail delivery are configured through
# environment variables only (never hardcoded here). See README section 4 and
# backend/.env.example for the full list:
#
#   JWT_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD, ADMIN_RESET_PASSWORD,
#   ADMIN_RESET_TOKEN, CORS_ALLOWED_ORIGINS, ROLE_MIGRATION_ENABLED,
#   AUTH_LOGIN_MAX_ATTEMPTS, AUTH_LOGIN_MAX_IP_ATTEMPTS,
#   AUTH_LOGIN_WINDOW_MINUTES, AUTH_FORGOT_MAX_REQUESTS,
#   AUTH_FORGOT_MAX_IP_REQUESTS, AUTH_FORGOT_WINDOW_MINUTES,
#   AUTH_RESET_MAX_ATTEMPTS, AUTH_RESET_WINDOW_MINUTES,
#   AUTH_TRUST_FORWARDED_FOR, PASSWORD_RESET_TOKEN_TTL_MINUTES,
#   PASSWORD_RESET_DEV_MODE, MAIL_HOST, MAIL_PORT, MAIL_USERNAME,
#   MAIL_PASSWORD, MAIL_FROM, MAIL_RESET_LINK_BASE, MAIL_SMTP_AUTH,
#   MAIL_SMTP_STARTTLS
# ---------------------------------------------------------------------------
