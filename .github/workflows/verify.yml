name: Verify PriyoniX One
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start isolated Mongo replica set
        run: |
          docker run --detach --name priyonix-test-mongo --publish 127.0.0.1:27017:27017 mongo:8 --replSet priyonix-test --bind_ip_all
          for i in {1..30}; do
            if docker exec priyonix-test-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec priyonix-test-mongo mongosh --quiet --eval 'rs.initiate({_id:"priyonix-test",members:[{_id:0,host:"localhost:27017"}]})'
          for i in {1..30}; do
            if docker exec priyonix-test-mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Backend unit and database integration tests
        working-directory: backend
        env:
          WORKSPACE_MONGO_TEST_URI: mongodb://127.0.0.1:27017/?replicaSet=priyonix-test
        run: bash mvnw -B verify
      - name: Frontend lint and production build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: backend/target/surefire-reports/*.xml
